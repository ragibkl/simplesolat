# App screens for the App Store, run on the iOS simulator by
# .github/workflows/ios-screenshots.yml. Permissions are granted up front and
# the location is Kuala Lumpur, so the app opens straight to its times.
# MODE (light/dark) prefixes the file names.
appId: com.simplesolat.app
---
- setLocation:
    latitude: 3.1390
    longitude: 101.6869
- launchApp:
    clearState: true
    permissions:
      location: always
      notifications: allow
# The zone line ("WLY01 - Source: ...") shows once location and times are in.
- extendedWaitUntil:
    visible: ".*Source.*"
    timeout: 60000
- assertVisible: "Fajr"
- takeScreenshot: ${MODE}-1-home

- tapOn:
    id: "header-settings"
# Text only on that screen: the header buttons are labelled "Settings" and
# "Qibla" too, so their names show up on the home screen as well.
- extendedWaitUntil:
    visible: "Permissions"
    timeout: 10000
- takeScreenshot: ${MODE}-2-settings

- launchApp
- extendedWaitUntil:
    visible: ".*Source.*"
    timeout: 30000
- tapOn:
    id: "header-qibla"
# The simulator has no compass, so the screen waits for one.
- extendedWaitUntil:
    visible: "Waiting for compass.*"
    timeout: 10000
- takeScreenshot: ${MODE}-3-qibla

# Builds simplesolat for the iOS simulator, opens its screens and adds its
# widget on an iPhone 6.9" and an iPad 13", and uploads the screenshots (App
# Store sizes, 9:41 status bar, light and dark). Also a smoke test: it fails
# if the app doesn't open to its prayer times.
#
#   gh workflow run ios-screenshots.yml
#   gh workflow run ios-screenshots.yml -f build_run=<run id>   # reuse that run's build
name: iOS screenshots

on:
  # Also on pull requests that change the flows or this workflow.
  pull_request:
    paths:
      - ".maestro/**"
      - ".github/workflows/ios-screenshots.yml"
  workflow_dispatch:
    inputs:
      build_run:
        description: "Reuse the simulator build from this run ID (skips the 20+ minute build)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.build_run == ''
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}

      - run: cd ios && pod install

      # Release, so the JavaScript is bundled into the app. Signed ad hoc ("-")
      # rather than not at all, so the app and widget keep their app group
      # entitlement and share the prayer times.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/simplesolat.xcworkspace -scheme simplesolat \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= | tail -n 40
          cd build/Build/Products/Release-iphonesimulator
          ls
          zip -qry "$GITHUB_WORKSPACE/simplesolat-app.zip" simplesolat.app

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: simplesolat-app.zip
          retention-days: 14

  screenshots:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: simulator-app
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}

      - run: unzip -q simplesolat-app.zip

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run on iPhone and iPad
        env:
          # Maestro's XCTest driver can be slow to start on shared runners.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          devtype() {
            xcrun simctl list devicetypes -j | python3 -c 'import json,re,sys; t=[d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if re.fullmatch(sys.argv[1], d["name"])]; print(t[-1])' "$1"
          }
          failed=0

          # flow <device> <name> <flow file> <MODE>: one retry, since the
          # driver's first start sometimes times out. On failure, save the
          # screen's element tree to see what Maestro could find.
          flow() {
            local udid=$1 name=$2 file=$3 mode=$4 out=screenshots/$2
            for try in 1 2; do
              if maestro --device "$udid" test -e MODE="$mode" \
                  --test-output-dir "maestro-out/$name" --debug-output "maestro-out/$name" \
                  ".maestro/$file"; then
                return 0
              fi
            done
            echo "$name: $file ($mode) failed" >> screenshots/failures.txt
            maestro --device "$udid" hierarchy > "$out/hierarchy-${file%.yaml}-$mode.json" 2>&1 || true
            xcrun simctl io "$udid" screenshot "$out/failed-${file%.yaml}-$mode.png" || true
            failed=1
            return 1
          }

          mkdir -p screenshots
          for spec in "iphone-6.9:iPhone [0-9]+ Pro Max" "ipad-13:iPad Pro 13-inch.*"; do
            name=${spec%%:*}
            udid=$(xcrun simctl create "$name" "$(devtype "${spec#*:}")" "$runtime")
            mkdir -p "screenshots/$name"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState charged --batteryLevel 100
            xcrun simctl location "$udid" set 3.1390,101.6869
            xcrun simctl install "$udid" simplesolat.app

            xcrun simctl ui "$udid" appearance light
            flow "$udid" "$name" screens.yaml light || true
            if flow "$udid" "$name" widget.yaml light; then
              flow "$udid" "$name" home.yaml light || true
            fi
            xcrun simctl ui "$udid" appearance dark
            flow "$udid" "$name" screens.yaml dark || true
            flow "$udid" "$name" home.yaml dark || true

            xcrun simctl shutdown "$udid"
          done

          # Maestro saves takeScreenshot files in its output folder.
          for name in iphone-6.9 ipad-13; do
            find "maestro-out/$name" -name '*.png' -exec cp {} "screenshots/$name/" \; 2>/dev/null || true
          done
          ls -R screenshots
          for f in screenshots/*/*.png; do
            echo "$f: $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"
          done
          cat screenshots/failures.txt 2>/dev/null || true
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: |
            screenshots
            maestro-out

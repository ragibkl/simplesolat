# Builds simplesolat for the iOS simulator, opens its screens on an iPhone
# 6.9" and an iPad 13" with its widgets (small, medium) on the home screen, and uploads the screenshots (App
# Store sizes, 9:41 status bar, light and dark). Also a smoke test: it fails
# if the app doesn't open to its prayer times.
#
#   gh workflow run ios-screenshots.yml
#   gh workflow run ios-screenshots.yml -f build_run=<run id>   # reuse that run's build
#   gh workflow run ios-screenshots.yml -f build_run=<run id> -f only=widget
name: iOS screenshots

on:
  # Also on pull requests that change the flows or this workflow.
  pull_request:
    paths:
      - ".maestro/**"
      - ".github/workflows/ios-screenshots.yml"
  workflow_dispatch:
    inputs:
      build_run:
        description: "Reuse the simulator build from this run ID (skips the 20+ minute build)"
        required: false
        default: ""
      only:
        description: "all, or widget (skips the dark app screens)"
        required: false
        default: "all"

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.build_run == ''
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The built app, keyed on everything that goes into it: a change to
      # the flows or this workflow alone reuses it.
      - uses: actions/cache@v4
        id: app
        with:
          path: simplesolat-app.zip
          key: simulator-app-${{ hashFiles('app/**', 'lib/**', 'modules/**', 'plugins/**', 'patches/**', 'assets/**', 'index.ts', 'app.json', 'package-lock.json') }}

      - uses: actions/setup-node@v4
        if: steps.app.outputs.cache-hit != 'true'
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
        if: steps.app.outputs.cache-hit != 'true'

      - name: Generate the iOS project
        if: steps.app.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install

      - uses: actions/cache@v4
        if: steps.app.outputs.cache-hit != 'true'
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}

      - run: cd ios && pod install
        if: steps.app.outputs.cache-hit != 'true'

      # Release, so the JavaScript is bundled into the app. Signed ad hoc ("-")
      # rather than not at all, so the app and widget keep their app group
      # entitlement and share the prayer times.
      - name: Build for the simulator
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/simplesolat.xcworkspace -scheme simplesolat \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= | tail -n 40
          cd build/Build/Products/Release-iphonesimulator
          ls
          zip -qry "$GITHUB_WORKSPACE/simplesolat-app.zip" simplesolat.app

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: simplesolat-app.zip
          retention-days: 14

  screenshots:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iphone-6.9
            device: "iPhone 17 Pro Max"
          - name: ipad-13
            device: "iPad Pro 13-inch \\(M5\\).*"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: simulator-app
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}

      - run: unzip -q simplesolat-app.zip

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run on ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
          DEVICE: ${{ matrix.device }}
          ONLY: ${{ inputs.only || 'all' }}
          # Maestro's XCTest driver can be slow to start on shared runners.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          # The simulator uses the runner's time zone (UTC): use Malaysia's,
          # so the times read as they do there.
          sudo systemsetup -settimezone Asia/Kuala_Lumpur || sudo ln -sf /usr/share/zoneinfo/Asia/Kuala_Lumpur /etc/localtime
          date

          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          devtype=$(xcrun simctl list devicetypes -j | python3 -c 'import json,re,sys; t=[d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if re.fullmatch(sys.argv[1], d["name"])]; print(t[-1])' "$DEVICE")
          out=screenshots/$NAME
          mkdir -p "$out"
          failed=0

          maestro_test() {
            maestro --device "$udid" test --test-output-dir maestro-out --debug-output maestro-out "$@"
          }

          # On failure, save the screen and its element tree to see what
          # Maestro could find.
          save_failure() {
            echo "$NAME: $1 failed" >> screenshots/failures.txt
            maestro --device "$udid" hierarchy > "$out/hierarchy-$2.json" 2>&1 || true
            xcrun simctl io "$udid" screenshot "$out/failed-$2.png" || true
            failed=1
          }

          # flow <file> <MODE>, with one retry: the driver's first start
          # sometimes times out.
          flow() {
            maestro_test -e MODE="$2" ".maestro/$1" || maestro_test -e MODE="$2" ".maestro/$1" \
              || { save_failure "$1 ($2)" "${1%.yaml}-$2"; return 1; }
          }

          udid=$(xcrun simctl create "$NAME" "$devtype" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100
          xcrun simctl location "$udid" set 3.1390,101.6869
          xcrun simctl install "$udid" simplesolat.app

          xcrun simctl ui "$udid" appearance light
          # The app has to run once before its widget has times to show.
          flow screens.yaml light || true
          if [ "$ONLY" != widget ]; then
            xcrun simctl ui "$udid" appearance dark
            flow screens.yaml dark || true
            xcrun simctl ui "$udid" appearance light
          fi
          # Widgets: write a home screen layout with them already in place
          # (.maestro/home-screen.plist), then restart the simulator. The app
          # has run above, so the widgets have times to show.
          sb=~/Library/Developer/CoreSimulator/Devices/$udid/data/Library/SpringBoard
          xcrun simctl shutdown "$udid"
          mkdir -p "$sb"
          plutil -convert binary1 -o "$sb/IconState.plist" .maestro/home-screen.plist
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100
          for mode in light dark; do
            xcrun simctl ui "$udid" appearance $mode
            sleep 20
            xcrun simctl io "$udid" screenshot "$out/$mode-4-widgets.png"
          done

          # SpringBoard's files after the restart, to check it kept the layout.
          mkdir -p "$out/springboard"
          ls -la "$sb" || true
          for f in "$sb"/*.plist; do
            [ -f "$f" ] && plutil -convert xml1 -o "$out/springboard/$(basename "$f")" "$f"
          done

          # Maestro saves takeScreenshot files in its output folder.
          find maestro-out -path '*takeScreenshot*' -name '*.png' -exec cp {} "$out/" \;
          for f in "$out"/*.png; do
            echo "$f: $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"
          done
          cat screenshots/failures.txt 2>/dev/null || true
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ matrix.name }}
          path: |
            screenshots
            maestro-out
